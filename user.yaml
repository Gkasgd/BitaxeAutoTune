# Direccion de pago para los pools stratum.
#
# ==========================================================================
# SI CLONASTE ESTE REPOSITORIO, CAMBIA ESTAS DOS LINEAS POR TU DIRECCION.
# La que viene es la del dueño del fork. Con --manage-pools y un miner que
# reporte stratumUser vacio, el hashrate iria a esa direccion, no a la tuya.
# ==========================================================================
#
# ESTE FICHERO SOLO SE LEE EN UN CASO, y con la configuracion por defecto no se
# lee nunca:
#
#   1. hay que arrancar con --manage-pools (o MANAGE_MINER_POOLS: TRUE), que por
#      defecto esta desactivado: tuning_manager.py corta antes y respeta la
#      configuracion stratum del miner, y
#   2. el miner tiene que reportar stratumUser vacio en su API. Si ya tiene un
#      usuario configurado desde AxeOS, ese gana y esto se ignora.
#
# Asi que en la mayoria de instalaciones esto es inerte. Pero cuando se cumplen
# las dos condiciones decide a donde va el hashrate, y lo hace en silencio: no
# hay ninguna linea de log que diga "voy a minar a esta direccion". De ahi el
# aviso de arriba.
#
# El sufijo despues del punto es el nombre del worker, y es libre.
#
# Hay que rellenar LAS DOS. El respaldo "si el fallback esta vacio usa el
# primario" de tuning_manager.py no llega a actuar: es el defecto de un .get() y
# _load_stratum_users siempre devuelve la clave, con "" cuando falta, asi que el
# vacio gana y el arranque aborta con "Stratum users missing".
stratumUser: bc1qatdwu9mrx4uq8sslhex8gsg5lk39cyxvu3y0lxplk46vxdzmgmpqjsqg93.gkasgd
