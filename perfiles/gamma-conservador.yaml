# gamma-conservador.yaml — perfil conservador para BM1370 (Bitaxe Gamma / 601)
#
# Se pasa con --config y sus claves se aplican ENCIMA de chips/BM1370.yaml, que
# el tuner elige solo leyendo el ASICModel del miner.
#
#   python bitaxepid.py --ip <ip-del-miner> --config perfiles/gamma-conservador.yaml
#
# Se llamaba safe-BM1370.yaml y estaba en la raiz, junto a los YAML de chip.
#
# Este fichero declara TODAS las claves que el programa lee, para que no haya que
# leer dos ficheros a la vez para saber con que corre. Antes heredaba diez de
# chips/BM1370.yaml, entre ellas los dos pasos de ajuste, que sí deciden cuanto
# se mueve cada valor en cada muestra.
#
#     de fabrica (chips/BM1370.yaml):  1000-1250 mV   400-625 MHz
#     este perfil:                     1100-1150 mV   425-500 MHz
#
# Para verlo sin arrancar contra el miner:
#
#   python bitaxepid.py --dry-run --asic BM1370 --config perfiles/gamma-conservador.yaml
#
# imprime cada clave con el fichero del que sale. Con este perfil, todas las
# lineas deben decir perfiles/gamma-conservador.yaml.

# --- Los cinco topes de seguridad ------------------------------------------

# El tuner baja frecuencia (y luego voltaje) en cuanto se pasa de aqui.
TARGET_TEMP: 55.0

# Tope duro de frecuencia. 500 en lugar de los 625 de fabrica.
MAX_FREQUENCY: 500

# Tope duro de voltaje. 1150 en lugar de los 1250 de fabrica.
MAX_VOLTAGE: 1150

# Los SUELOS, declarados aqui y no heredados. Antes este perfil solo bajaba los
# maximos, asi que MIN_VOLTAGE y MIN_FREQUENCY salian de BM1370.yaml: 1000 mV y
# 400 MHz, los de fabrica. Un perfil llamado "safe" con el rango efectivo
# 1000-1150 mV, o sea 150 mV de recorrido hacia abajo desde su propio tope.
#
# Importa porque el suelo no es decorativo: es hasta donde puede bajar la
# busqueda del voltaje minimo (prioridad 5) y hasta donde baja la rama termica
# cuando ya no queda frecuencia. A 1000 mV un BM1370 no mina de forma estable,
# asi que el tuner podia gastar horas explorando voltajes inservibles y
# quedarse ahi si la temperatura seguia alta.
#
# 1100 es el INITIAL_VOLTAGE de este perfil: arrancar EN el suelo es
# deliberado, porque el camino previsto es subir. Con 425 MHz queda un escalon
# de FREQUENCY_STEP por debajo del arranque, suficiente para que la rama
# termica tenga a donde bajar sin irse a la mitad de la frecuencia.
MIN_VOLTAGE: 1100
MIN_FREQUENCY: 425

# --- Arranque conservador --------------------------------------------------
# Se arranca por debajo de los topes y se deja subir al PID, en vez de empezar
# arriba y bajar. Asi el primer minuto tampoco pasa por un punto caliente.
INITIAL_FREQUENCY: 450
INITIAL_VOLTAGE: 1100

# --- Coherencia con los topes ---------------------------------------------
# El setpoint de hashrate es el objetivo que persigue el PID. Con la frecuencia
# limitada a 500 MHz no se pueden alcanzar los ~500 GH/s del perfil de fabrica,
# y un setpoint inalcanzable mantiene al controlador pidiendo mas para siempre:
# acaba pegado al techo de voltaje sin ganar nada. Se baja a algo alcanzable
# dentro de los limites.
HASHRATE_SETPOINT: 400

# El limite de potencia se aplica con un margen del 7.5% (POWER_LIMIT * 1.075),
# asi que 13.0 empieza a bajar voltaje alrededor de los 14 W.
POWER_LIMIT: 13.0

# Muestreo cada 60 s: el hardware tarda en estabilizarse tras un cambio, y
# medir mas a menudo hace que el PID reaccione a ruido.
SAMPLE_INTERVAL: 60

# --- Comportamiento -------------------------------------------------------

# No tocar la configuracion de pools del miner. Si algun dia se quiere lo
# contrario, es mejor decirlo con --manage-pools en esa ejecucion concreta que
# dejarlo activado en un fichero.
MANAGE_MINER_POOLS: FALSE

# Metricas en JSON en http://<host>:8093/metrics. Sirve tambien para
# comprobar de un vistazo que este perfil se cargo: la respuesta incluye
# MAX_VOLTAGE, MAX_FREQUENCY y TARGET_TEMP.
METRICS_SERVE: TRUE

# Ficheros propios, para no mezclar el historial de este perfil con el del
# perfil de fabrica. En data/ para que docker-compose.yml pueda montar ahi un
# volumen y el historial sobreviva al contenedor; ejecutandolo directamente,
# el directorio se crea solo.
LOG_FILE: "data/bitaxepid_tuning_log_BM1370_safe.csv"
SNAPSHOT_FILE: "data/bitaxepid_snapshot_BM1370_safe.json"

# --- Las diez claves que antes se heredaban -------------------------------
# Estaban en chips/BM1370.yaml y no aqui, con los mismos valores que se repiten
# ahora. Se declaran para que este fichero se pueda leer solo, y porque dos de
# ellas no son inertes: los pasos deciden cuanto se mueve el tuner en cada
# muestra, asi que heredarlos hacia que un cambio en el YAML de fabrica alterara
# el comportamiento de este perfil sin tocarlo.

# Cuanto sube o baja el tuner en cada decision. Con 25 MHz y el rango
# 425-500 MHz de este perfil quedan solo tres escalones, que es lo que se quiere
# de un perfil conservador: pocos puntos de operacion y bien separados.
FREQUENCY_STEP: 25
VOLTAGE_STEP: 10

# Los pools y el fichero de usuario. Rutas relativas al directorio de trabajo
# (/app en el contenedor), no a este fichero.
POOLS_FILE: "pools.yaml"
USER_FILE: "user.yaml"

# Ganancias del PID. Este perfil NO declara ERROR_TUNING, asi que corre la
# estrategia por limites (tuning.py), que decide con cinco reglas de prioridad y
# tampoco lee estas seis claves: ningun modulo lo hace. Se declaran porque
# validate_config las exige cuando ERROR_TUNING esta desactivado, y porque son
# columnas del CSV que se comparan con historiales antiguos. No hay ningun PID en
# el programa; el nombre es lo que quedo de la version original.
PID_FREQ_KP: 0.2
PID_FREQ_KI: 0.01
PID_FREQ_KD: 0.02
PID_VOLT_KP: 0.1
PID_VOLT_KI: 0.01
PID_VOLT_KD: 0.02
